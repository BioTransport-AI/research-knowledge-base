[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biotransport-datasets"
version = "0.1.0"
description = "Fetch/index/load layer for BioTransport AI's research datasets (Parquet metadata index, lazy image loading)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
images = ["pillow>=10.0"]
torch = ["torch>=2.2"]

[tool.setuptools]
packages = ["biotransport_datasets", "biotransport_datasets.recipes"]
